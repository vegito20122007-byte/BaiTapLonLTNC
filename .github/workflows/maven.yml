name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn về runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường JDK
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Biên dịch toàn bộ các module và chạy bộ kiểm thử Unit Test
      - name: Build with Maven and Run Unit Tests
        run: mvn -B clean test --file pom.xml

      # 4. Kiểm tra quy chuẩn mã nguồn Google Java Style
      - name: Run Checkstyle Audit
        run: mvn -B checkstyle:check --file pom.xml